<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Strand social preview</title>
  <desc id="description">Strand, a fast keyboard-first Git client for reviewing agent-written code.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1813" />
      <stop offset="0.55" stop-color="#12110e" />
      <stop offset="1" stop-color="#0b0a08" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 112) rotate(143) scale(620 470)">
      <stop offset="0" stop-color="#f59b42" stop-opacity="0.22" />
      <stop offset="0.52" stop-color="#f59b42" stop-opacity="0.06" />
      <stop offset="1" stop-color="#f59b42" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.026" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.38" />
    </filter>
    <clipPath id="mark-clip"><rect x="0" y="0" width="80" height="80" rx="16" /></clipPath>
    <style>
      @font-face { font-family: Geist; src: url("fonts/geist-400-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: Geist; src: url("fonts/geist-500-latin.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: Geist; src: url("fonts/geist-600-latin.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: JetBrains Mono; src: url("fonts/jetbrains-mono-600-latin.woff2") format("woff2"); font-weight: 600; }
      .sans { font-family: Geist, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <path d="M0 516C243 472 431 556 656 521C837 493 985 403 1200 436V630H0Z" fill="#f59b42" fill-opacity="0.035" />
  <path d="M0 548C251 500 434 584 665 548C866 516 1001 435 1200 463" fill="none" stroke="#f59b42" stroke-opacity="0.16" stroke-width="2" />

  <g transform="translate(82 72)">
    <rect width="76" height="76" rx="18" fill="#f59b42" fill-opacity="0.12" stroke="#f59b42" stroke-opacity="0.34" />
    <g transform="translate(10 10) scale(.7)" clip-path="url(#mark-clip)" fill="#ffab59">
      <path d="m70.4 1.3c-2.4 0-4.7 1-6.2 3.7l-26.7.1c-5.5 0-9.9 1.1-13.9 3.9-4.4 3-9.6 8.9-10.3 15.8-1.2 10.1 3.5 21.1 14.7 24.6 3.7 1.2 7.6 1.6 13.9 2.8 1.7.3 3.4.6 4.8 2.1 2.3 2.2 2 5.1-.2 8.8-2 3.1-5.1 6.4-10.1 6.5H15.7c-1-2-3.1-3.7-6.1-3.6-3.1.1-6.1 2.6-6.1 6.5.1 3.4 2.7 6.5 6.2 6.5 2.6 0 5-1.2 6.1-4.1h20.7c5.4 0 9.2-1.8 12.4-5.2 2.9-3.2 5-7.5 4.9-11.6-.1-4.5-3.5-9.1-8.6-10.4-4-1-9.6-1.7-13.2-2.5-8.1-1.7-13.2-8.7-13.2-17.1.1-7.5 5.9-17.1 17.7-17.6h27.8c1.1 2.2 3.1 3.7 6.1 3.7 3.3-.1 6.1-2.5 6.1-6.2.1-3.3-2.5-6.7-6.1-6.7zM9.7 75.3c-1.4 0-2.7-1.2-2.7-2.8 0-1.4 1.2-2.9 2.7-2.9 1.6 0 2.9 1.3 2.9 2.9 0 1.4-1.3 2.8-2.9 2.8zm60.6-64.8c-1.5.1-3-1-3-2.9 0-1.2 1.1-2.9 3-2.8 1.3 0 2.8 1.1 2.8 2.8 0 1.6-1.5 2.8-2.8 2.9z" />
      <path d="M53.2 17.9v5.3H37.9c-4 0-5.8 3-5.8 5.5 0 2.6 2.1 5 4.8 5.9 2.3.7 9.3 1.8 13.8 2.8 7.7 1.5 15.9 8.5 16 19.7-.1 6.6-3 13.4-10.1 19.1H45.1c6.7-1.8 16-8.6 16.1-18.6 0-6.3-4.1-13.1-11.2-14.6-3.1-.7-10-1.6-13.6-2.6-4.8-1.2-9.9-4.8-9.9-11.6 0-5 4.1-10.8 11.3-10.8h15.4v-.1z" />
    </g>
    <text x="98" y="51" class="mono" font-size="34" font-weight="600" letter-spacing="-1" fill="#f4efe6">strand</text>
  </g>

  <g transform="translate(82 222)">
    <text class="sans" font-size="66" font-weight="600" letter-spacing="-2.4" fill="#f7f2e9">
      <tspan x="0" y="0">Agents write the code.</tspan>
      <tspan x="0" y="78" fill="#ff9f43">You review it.</tspan>
    </text>
    <text x="2" y="142" class="sans" font-size="25" font-weight="400" fill="#b9b1a6">A fast, keyboard-first Git client for the agent era.</text>
  </g>

  <g transform="translate(82 492)" class="mono" font-size="15" font-weight="600">
    <g><rect width="148" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1" /><text x="22" y="27" fill="#d8d1c8">WHOLE CONTEXT</text></g>
    <g transform="translate(162)"><rect width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1" /><text x="22" y="27" fill="#d8d1c8">LIVE CHANGES</text></g>
    <g transform="translate(326)"><rect width="174" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1" /><text x="22" y="27" fill="#d8d1c8">KEYBOARD FIRST</text></g>
  </g>

  <g transform="translate(790 122) rotate(2 160 190)" filter="url(#shadow)">
    <rect width="336" height="382" rx="22" fill="#1e1b17" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="1" y="1" width="334" height="50" rx="21" fill="#25211c" />
    <circle cx="25" cy="26" r="5" fill="#ff665c" /><circle cx="43" cy="26" r="5" fill="#e6b94f" /><circle cx="61" cy="26" r="5" fill="#55c68c" />
    <text x="91" y="31" class="mono" font-size="12" fill="#989087">review / agent-refactor</text>
    <rect x="17" y="68" width="302" height="46" rx="10" fill="#f59b42" fill-opacity="0.09" stroke="#f59b42" stroke-opacity="0.22" />
    <text x="32" y="88" class="mono" font-size="11" fill="#ffab59">M</text><text x="57" y="89" class="mono" font-size="11" fill="#dfd8cf">src/review/queue.ts</text>
    <text x="57" y="104" class="sans" font-size="10" fill="#827a71">12 additions · 4 deletions</text>
    <g class="mono" font-size="10">
      <text x="22" y="143" fill="#6e675f">38</text><text x="47" y="143" fill="#847d74">const next = queue[index];</text>
      <rect x="16" y="154" width="303" height="25" fill="#d45353" fill-opacity="0.11" /><text x="22" y="170" fill="#a76d68">39</text><text x="47" y="170" fill="#e59a94">- return items.filter(Boolean);</text>
      <rect x="16" y="179" width="303" height="25" fill="#55b982" fill-opacity="0.12" /><text x="22" y="195" fill="#68a981">39</text><text x="47" y="195" fill="#8ed6aa">+ return items.filter(isReviewable);</text>
      <text x="22" y="226" fill="#6e675f">40</text><text x="47" y="226" fill="#847d74">}</text>
    </g>
    <rect x="17" y="252" width="302" height="78" rx="11" fill="#171512" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="32" y="276" class="sans" font-size="12" font-weight="500" fill="#e5ddd3">Review with full context</text>
    <text x="32" y="297" class="sans" font-size="10.5" fill="#8f877e">See the surrounding file, leave a note,</text>
    <text x="32" y="313" class="sans" font-size="10.5" fill="#8f877e">and send precise feedback back to the agent.</text>
    <rect x="212" y="343" width="107" height="25" rx="7" fill="#f59b42" /><text x="231" y="360" class="mono" font-size="10" font-weight="600" fill="#21160b">MARK REVIEWED</text>
  </g>

  <text x="82" y="589" class="mono" font-size="16" font-weight="600" fill="#827a71">strandgit.com</text>
</svg>
