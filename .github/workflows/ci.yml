name: CI

# PR-level gate: Rust tests + clippy, TypeScript typecheck, and the frontend
# unit suite. This is the review backstop for a codebase where most changes
# are agent-authored — release.yml only fires on tags, so without this
# nothing checks a PR at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # strand-tauri links the full Tauri stack, which needs the webkit/gtk
      # dev packages even for `cargo check`.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            git-lfs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci

      # Several strand-core tests shell out to the runner's git.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Test strand-core
        run: cargo test -p strand-core

      - name: Test Strand companion
        run: cargo test -p strand-ops -p strand-headless

      - name: Test strand-tauri
        run: cargo test -p strand-tauri

      - name: Test Azure DevOps Server helper
        run: cargo test -p strand-azdo-protocol -p strand-azdo

      - name: Clippy (deny warnings)
        run: cargo clippy -p strand-core -p strand-tauri -p strand-ops -p strand-headless -p strand-azdo-protocol -p strand-azdo -- -D warnings

  windows-helper:
    name: Azure DevOps Server helper (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-strand-azdo-windows
      - name: Compile and test WinHTTP authentication transport
        run: cargo test -p strand-azdo

  windows-review:
    name: Native agent review (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-native-review-windows
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      # Runtime detection/install follows Microsoft's WebView2 distribution guide:
      # https://learn.microsoft.com/microsoft-edge/webview2/concepts/distribution
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $installed = $runtimeKeys | ForEach-Object {
            (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
          } | Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (-not $installed) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 install failed: $($process.ExitCode)" }
          }
      # The harness runs the actual Tauri app with an isolated identity/profile.
      - name: Exercise native review, persistence and recovery twice
        run: node scripts/test-review-native.mjs --repeat 2 --output target/review-native-ci
      - name: Retain native screenshots, feedback and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-review-windows
          path: target/review-native-ci
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads the pinned version from
      # package.json `packageManager`, and specifying both is an error.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release security policy
        run: pnpm release:check-security

      - name: Test Azure DevOps helper release manifest
        run: pnpm release:test-helper

      - name: Verify Microsoft Store package policy
        run: pnpm store:check

      - name: Verify Microsoft Store MSIX policy
        run: pnpm run store:msix:check

      - name: Typecheck
        run: pnpm --filter ./ui exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter ./ui test
