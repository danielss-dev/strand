[package]
name = "strand-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only Strand companion and stdio engine."

[[bin]]
name = "strand-cli"
path = "src/main.rs"

[dependencies]
strand-core = { path = "../strand-core" }
strand-ops = { path = "../strand-ops" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
