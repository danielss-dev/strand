name: CI

# PR-level gate: Rust tests + clippy, TypeScript typecheck, and the frontend
# unit suite. This is the review backstop for a codebase where most changes
# are agent-authored — release.yml only fires on tags, so without this
# nothing checks a PR at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # strand-tauri links the full Tauri stack, which needs the webkit/gtk
      # dev packages even for `cargo check`.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci

      # Several strand-core tests shell out to the runner's git.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Test strand-core
        run: cargo test -p strand-core

      - name: Test strand-tauri
        run: cargo test -p strand-tauri

      - name: Test Azure DevOps Server helper
        run: cargo test -p strand-azdo-protocol -p strand-azdo

      - name: Clippy (deny warnings)
        run: cargo clippy -p strand-core -p strand-tauri -p strand-azdo-protocol -p strand-azdo -- -D warnings

  windows-helper:
    name: Azure DevOps Server helper (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-strand-azdo-windows
      - name: Compile and test WinHTTP authentication transport
        run: cargo test -p strand-azdo

  web:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads the pinned version from
      # package.json `packageManager`, and specifying both is an error.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release security policy
        run: pnpm release:check-security

      - name: Verify Microsoft Store package policy
        run: pnpm store:check

      - name: Typecheck
        run: pnpm --filter ./ui exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter ./ui test
