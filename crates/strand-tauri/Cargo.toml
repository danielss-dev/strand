[package]
name = "strand-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strand desktop app shell (Tauri 2)."

[[bin]]
name = "strand"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
strand-core = { path = "../strand-core" }
strand-ops = { path = "../strand-ops" }
strand-azdo-protocol = { path = "../strand-azdo-protocol" }

tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Used only to heal stale sqlx migration checksums on existing DBs (see
# state::repair_migration_checksums). sqlx + sha2 are already in the tree via
# tauri-plugin-sql, so these direct deps add ~no build cost.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
sha2 = "0.10"
sha1_smol = "1"
base64 = "0.22"
flate2 = "1"
minisign-verify = "0.2.5"
keyring = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "rustls-native-certs"] }
tar = "0.4"
uuid.workspace = true
url.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }
zeroize = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Services_Store",
    "System",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Enables Tauri's custom-protocol production build (set by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]
