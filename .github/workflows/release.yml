name: Release

# Builds and signs Strand desktop releases and independently versioned
# strand-azdo helper releases.
#
# Trigger by pushing a version tag (`git tag v0.1.0 && git push origin v0.1.0`),
# or run manually from the Actions tab. The job opens a **draft** GitHub Release
# and uploads each platform's installers to it; you review and publish.
#
# Keep the tag in sync with `version` in tauri.conf.json / Cargo.toml /
# package.json — Tauri names the artifacts (e.g. Strand_0.1.0_aarch64.dmg) from
# the config version, not the tag.
#
# Push `strand-azdo-vX.Y.Z` to publish the helper to its immutable release and
# protocol-specific rolling channel. Required / optional secrets are documented
# in docs/packaging.md § "Release CI".

on:
  push:
    tags:
      - 'v*'
      - 'strand-azdo-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag: vX.Y.Z for Strand, or strand-azdo-vX.Y.Z for a helper-only release.'
        required: true
      helpers_only:
        description: 'Backfill signed strand-azdo assets without rebuilding desktop installers.'
        type: boolean
        default: false

jobs:
  helper:
    if: ${{ startsWith(github.ref_name, 'strand-azdo-v') || (github.event_name == 'workflow_dispatch' && inputs.helpers_only) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: 'false'
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve helper release version
        shell: bash
        run: echo "HELPER_VERSION=${VERSION#strand-azdo-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify release security policy
        run: node scripts/check-release-security.mjs
      - name: Verify release tag matches strand-azdo version
        run: node scripts/check-azdo-release-version.mjs
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: strand-azdo-${{ matrix.target }}

      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build universal macOS helper
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cargo build -p strand-azdo --release --target aarch64-apple-darwin
          cargo build -p strand-azdo --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/strand-azdo \
            target/x86_64-apple-darwin/release/strand-azdo \
            -output dist/strand-azdo
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" dist/strand-azdo
          codesign --verify --strict --verbose=2 dist/strand-azdo
          ASSET="strand-azdo-${HELPER_VERSION}-${{ matrix.target }}.zip"
          zip -j "dist/$ASSET" dist/strand-azdo
          xcrun notarytool submit "dist/$ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          node scripts/azdo-helper-metadata.mjs \
            dist/strand-azdo "dist/$ASSET" "${{ matrix.target }}" "$ASSET" \
            "dist/${{ matrix.target }}.metadata.json"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Linux helper
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cargo build -p strand-azdo --release --target "${{ matrix.target }}"
          mkdir -p dist
          ASSET="strand-azdo-${HELPER_VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$ASSET" -C "target/${{ matrix.target }}/release" strand-azdo
          node scripts/azdo-helper-metadata.mjs \
            "target/${{ matrix.target }}/release/strand-azdo" "dist/$ASSET" \
            "${{ matrix.target }}" "$ASSET" "dist/${{ matrix.target }}.metadata.json"

      - name: Build Windows helper
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build -p strand-azdo --release --target "${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $Asset = "strand-azdo-$env:HELPER_VERSION-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/strand-azdo.exe" -DestinationPath "dist/$Asset"
          node scripts/azdo-helper-metadata.mjs `
            "target/${{ matrix.target }}/release/strand-azdo.exe" "dist/$Asset" `
            "${{ matrix.target }}" "$Asset" "dist/${{ matrix.target }}.metadata.json"

      - name: Upload helper build
        uses: actions/upload-artifact@v4
        with:
          name: strand-azdo-${{ matrix.target }}
          path: |
            dist/strand-azdo-*.zip
            dist/strand-azdo-*.tar.gz
            dist/*.metadata.json
          if-no-files-found: error

  release:
    if: ${{ !startsWith(github.ref_name, 'strand-azdo-v') && (github.event_name != 'workflow_dispatch' || !inputs.helpers_only) }}
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel in one universal binary.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # .deb / .rpm / .AppImage
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          # .msi
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    # crates.io downloads flaked twice on 2026-06-12 (curl 16 "HTTP2 framing
    # layer" on Linux, curl 18 "partial file" on macOS). More retries + no
    # HTTP/2 multiplexing makes the registry fetch survivable.
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: 'false'
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget

      # No `version:` here — pnpm/action-setup reads the pinned version from
      # package.json `packageManager`, and specifying both is an error.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Keep the cache distinct per platform/target combination.
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release security policy
        run: pnpm release:check-security

      - name: Verify release tag matches Strand version
        run: node scripts/check-release-version.mjs

      - name: Verify compatible helper downloads are published
        run: pnpm release:check-helper

      - name: Install Cosign
        if: matrix.platform == 'ubuntu-22.04'
        uses: sigstore/cosign-installer@v4.1.2

      # The beforeBuildCommand signs the companion before Tauri imports its
      # own bundling keychain, so the identity must already be available.
      - name: Import macOS signing certificate for companion
        if: matrix.platform == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- macOS code signing (Developer ID) ---
          # Base64 of the exported .p12 + its export password. tauri-action
          # imports these into a throwaway keychain on the runner.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

          # --- macOS notarization (Apple notary service) ---
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # --- Tauri auto-updater signing (required) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Tauri project lives at crates/strand-tauri, not the default
          # src-tauri — point tauri-action at it so it finds the config + bundles.
          projectPath: crates/strand-tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Strand ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify updater signature identity
        run: pnpm release:check-updater-signatures

      - name: Sign and verify Linux AppImage with Sigstore
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' APPIMAGES < <(find target -type f -path '*/release/bundle/appimage/*.AppImage' -print0)
          if [ "${#APPIMAGES[@]}" -eq 0 ]; then
            echo "No release AppImage found to sign" >&2
            exit 1
          fi

          IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"
          for ARTIFACT in "${APPIMAGES[@]}"; do
            BUNDLE="${ARTIFACT}.sigstore.json"
            cosign sign-blob --yes --bundle "$BUNDLE" "$ARTIFACT"
            cosign verify-blob "$ARTIFACT" \
              --bundle "$BUNDLE" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            gh release upload "$RELEASE_TAG" "$BUNDLE" --clobber
          done

  helper-release:
    needs: helper
    if: ${{ always() && needs.helper.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download helper builds
        uses: actions/download-artifact@v4
        with:
          pattern: strand-azdo-*
          path: helper-dist
          merge-multiple: true
      - name: Build and sign helper manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/azdo-helper-manifest.mjs helper-dist helper-dist/strand-azdo-manifest.json
          pnpm tauri signer sign helper-dist/strand-azdo-manifest.json
          node scripts/check-updater-signatures.mjs helper-dist/strand-azdo-manifest.json.sig
          node -e "const fs=require('node:fs'); const source='helper-dist/strand-azdo-manifest.json.sig'; fs.writeFileSync('helper-dist/strand-azdo-manifest.json.minisig', Buffer.from(fs.readFileSync(source, 'utf8').trim(), 'base64')); fs.unlinkSync(source)"
      - name: Create dedicated helper release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Helper release $RELEASE_TAG is already published; bump the helper version" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "${RELEASE_TAG/strand-azdo-/strand-azdo }" \
              --notes "Signed strand-azdo helper release. Strand selects it only through a compatible protocol channel." \
              --draft \
              --prerelease
          fi
      - name: Upload helper assets to the dedicated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            helper-dist/strand-azdo-*.zip \
            helper-dist/strand-azdo-*.tar.gz \
            --clobber
          gh release upload "$RELEASE_TAG" \
            helper-dist/strand-azdo-manifest.json.minisig --clobber
          gh release upload "$RELEASE_TAG" \
            helper-dist/strand-azdo-manifest.json --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease
      - name: Preserve signed helper assets for rolling promotion
        uses: actions/upload-artifact@v4
        with:
          name: strand-azdo-release-assets
          path: |
            helper-dist/strand-azdo-*.zip
            helper-dist/strand-azdo-*.tar.gz
            helper-dist/strand-azdo-manifest.json
            helper-dist/strand-azdo-manifest.json.minisig
          if-no-files-found: error

  helper-promote:
    needs: helper-release
    if: ${{ always() && needs['helper-release'].result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Download signed helper assets
        uses: actions/download-artifact@v4
        with:
          name: strand-azdo-release-assets
          path: helper-dist
      - name: Publish protocol-specific and legacy-compatible channels
        run: |
          PROTOCOL_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('helper-dist/strand-azdo-manifest.json')).protocol_version")"
          CHANNEL="strand-azdo-protocol-$PROTOCOL_VERSION"
          TARGET_SHA="$(git rev-parse HEAD)"

          publish_channel() {
            local channel="$1"
            local title="$2"
            if ! gh release view "$channel" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$channel" --repo "$GITHUB_REPOSITORY" \
                --target "$TARGET_SHA" \
                --title "$title" \
                --notes "Rolling signed strand-azdo assets for protocol $PROTOCOL_VERSION." \
                --prerelease
            fi
            gh release upload "$channel" --repo "$GITHUB_REPOSITORY" \
              helper-dist/strand-azdo-*.zip \
              helper-dist/strand-azdo-*.tar.gz \
              --clobber
            gh release upload "$channel" --repo "$GITHUB_REPOSITORY" \
              helper-dist/strand-azdo-manifest.json.minisig --clobber
            gh release upload "$channel" --repo "$GITHUB_REPOSITORY" \
              helper-dist/strand-azdo-manifest.json --clobber
          }

          publish_channel "$CHANNEL" "strand-azdo protocol $PROTOCOL_VERSION"
          if [ "$PROTOCOL_VERSION" = "5" ]; then
            publish_channel strand-azdo-latest "strand-azdo latest (legacy protocol 5)"
          fi

  helper-smoke:
    needs: helper-promote
    if: ${{ always() && needs['helper-promote'].result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download through Strand's published protocol channel
        run: |
          mkdir -p tagged smoke
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern strand-azdo-manifest.json --dir tagged
          PROTOCOL_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('tagged/strand-azdo-manifest.json')).protocol_version")"
          CHANNEL="strand-azdo-protocol-$PROTOCOL_VERSION"
          ASSET="$(node -e "const m=JSON.parse(require('fs').readFileSync('tagged/strand-azdo-manifest.json')); process.stdout.write(m.assets.find((a) => a.target === 'x86_64-unknown-linux-gnu').name)")"
          gh release download "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
            --pattern strand-azdo-manifest.json \
            --pattern "$ASSET" \
            --dir smoke
          tar -xzf "smoke/$ASSET" -C smoke
          node scripts/azdo-helper-metadata.mjs \
            smoke/strand-azdo "smoke/$ASSET" x86_64-unknown-linux-gnu "$ASSET" \
            smoke/downloaded.metadata.json
          node scripts/check-azdo-helper-metadata.mjs \
            smoke/strand-azdo-manifest.json smoke/downloaded.metadata.json
          if [ "$PROTOCOL_VERSION" = "5" ]; then
            mkdir legacy
            gh release download strand-azdo-latest --repo "$GITHUB_REPOSITORY" \
              --pattern strand-azdo-manifest.json \
              --pattern "$ASSET" \
              --dir legacy
            tar -xzf "legacy/$ASSET" -C legacy
            node scripts/azdo-helper-metadata.mjs \
              legacy/strand-azdo "legacy/$ASSET" x86_64-unknown-linux-gnu "$ASSET" \
              legacy/downloaded.metadata.json
            node scripts/check-azdo-helper-metadata.mjs \
              legacy/strand-azdo-manifest.json legacy/downloaded.metadata.json
          fi
