[package]
name = "strand-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strand desktop app shell (Tauri 2)."

[[bin]]
name = "strand"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
strand-core = { path = "../strand-core" }

tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Used only to heal stale sqlx migration checksums on existing DBs (see
# state::repair_migration_checksums). sqlx + sha2 are already in the tree via
# tauri-plugin-sql, so these direct deps add ~no build cost.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[features]
# Enables Tauri's custom-protocol production build (set by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]
